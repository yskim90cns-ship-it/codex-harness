[features]
hooks = true

[[hooks.pre_tool_use]]
matcher = "apply_patch|functions.apply_patch|Edit|Write|MultiEdit"

[[hooks.pre_tool_use.hooks]]
type = "command"
command = 'node .codex/hooks/tdd-precheck.mjs'
timeout = 10
status_message = "Checking Codex TDD precheck"

[[hooks.stop]]
matcher = ""

[[hooks.stop.hooks]]
type = "command"
command = 'bash .codex/hooks/lint_build_test.sh'
timeout = 120
status_message = "Running lint, build, and tests"
